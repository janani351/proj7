<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><span class="tag">YOUR SPACE</span><h1>Notes</h1><p>Keep your thoughts in one place.</p></div><button id="newNote">＋ New note</button></header><div class="layout"><aside><input id="search" placeholder="Search notes…"><div id="noteList" class="note-list"></div></aside><section class="editor"><input id="title" placeholder="Note title"><textarea id="content" placeholder="Start writing your note…"></textarea><footer><span id="status">Your notes are saved on this device.</span><button id="delete" class="danger">Delete note</button></footer></section></div></main><script src="script.js"></script></body></html>
