<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Tracker</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><span class="tag">CAREER DASHBOARD</span><h1>Job Application Tracker</h1><p>Track every opportunity, one step at a time.</p></div><button id="addBtn">＋ Add application</button></header><section class="stats"><article><span>Total applications</span><strong id="total">0</strong></article><article><span>Interviews</span><strong id="interviews">0</strong></article><article><span>Offers</span><strong id="offers">0</strong></article><article><span>Follow-ups due</span><strong id="followups">0</strong></article></section><section class="toolbar"><input id="search" placeholder="Search company or role…"><select id="filter"><option value="All">All statuses</option><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></section><section id="cards" class="cards"></section></main><dialog id="dialog"><form id="form" method="dialog"><div class="formhead"><h2 id="formTitle">Add application</h2><button type="button" id="close" class="close">×</button></div><input type="hidden" id="editId"><label>Company name<input id="company" required placeholder="e.g. Acme Technologies"></label><label>Job role<input id="role" required placeholder="e.g. Frontend Developer"></label><div class="two"><label>Status<select id="status"><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label>Application date<input id="date" type="date"></label></div><label>Follow-up date<input id="follow" type="date"></label><label>Job link<input id="link" type="url" placeholder="https://…"></label><label>Notes<textarea id="notes" rows="3" placeholder="Recruiter details, interview notes…"></textarea></label><button class="save" type="submit">Save application</button></form></dialog><script src="script.js"></script></body></html>
